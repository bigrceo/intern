name: tick

# The runtime needs a tick every minute (Vercel Hobby only allows a daily cron).
# GitHub runs this every 5 minutes; each run calls the tick five times, a minute apart.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: tick every minute for five minutes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS -m 55 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/tick" || echo "tick failed $(date -u)"
            echo
            if [ "$i" -lt 5 ]; then sleep 60; fi
          done
